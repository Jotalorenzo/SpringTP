<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Facturas</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>Gestión de Factura de Venta</h1>

    <!-- Barra de búsqueda rápida para probar Estados -->
    <div
      class="section"
      style="display: flex; gap: 10px; align-items: flex-end"
    >
      <div style="flex: 1">
        <label>Buscar Factura Existente (por ID de BD):</label>
        <input
          type="number"
          id="buscarIdInput"
          placeholder="Prueba con ID 1, 2, 3 o las que crees..."
        />
      </div>
      <button id="btnBuscarFactura" class="btn-primary">Cargar</button>
      <button id="btnNuevaFactura" class="btn-outline">+ Nueva Factura</button>
    </div>

    <!-- Alerta dinámica del estado de la factura cargada -->
    <div id="alertaEstado" style="display: none"></div>

    <div class="section">
      <h3>Cabecera de Factura</h3>
      <div class="form-group">
        <label
          >Número Factura (Dejar vacío para crear como Borrador sin
          número):</label
        >
        <input
          type="number"
          id="numeroFacturaInput"
          placeholder="Ej: 1005 (o vacío para Borrador)"
        />
      </div>
      <div class="form-group">
        <label>Cliente:</label>
        <select id="clienteSelect">
          <option value="">Cargando...</option>
        </select>
      </div>
      <div class="form-group">
        <label>Punto de Venta:</label>
        <select id="puntoVentaSelect">
          <option value="">Cargando...</option>
        </select>
      </div>
      <div class="form-group">
        <label>Moneda:</label>
        <select id="monedaSelect">
          <option value="">Cargando...</option>
        </select>
      </div>
    </div>

    <div class="section" id="seccionDetalles">
      <h3>Detalle de Artículos</h3>
      <div style="display: flex; gap: 10px; align-items: flex-end">
        <div style="flex: 1">
          <label>Artículo:</label>
          <select id="articuloSelect">
            <option value="">Cargando...</option>
          </select>
        </div>
        <div style="width: 120px">
          <label>Cantidad:</label>
          <input type="number" id="cantidadInput" min="1" value="1" />
        </div>
        <button id="btnAgregarLinea" class="btn-outline">+ Agregar</button>
      </div>

      <table id="tablaDetalles">
        <thead>
          <tr>
            <th>ID Artículo</th>
            <th>Cantidad</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- Botones de Acción Contextuales -->
    <div class="actions-bar">
      <button id="btnGuardarFactura" class="btn-primary">Crear Factura</button>
      <button
        id="btnActualizarFactura"
        class="btn-primary"
        style="display: none"
      >
        Guardar Cambios
      </button>
      <button id="btnAnularFactura" class="btn-warning" style="display: none">
        Anular Factura
      </button>
      <button id="btnEliminarFactura" class="btn-danger" style="display: none">
        Eliminar Factura
      </button>
    </div>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
