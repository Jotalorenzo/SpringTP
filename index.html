<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Facturas</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <h1>Gestión de Facturas de Venta</h1>

    <!-- 1. GRILLA Y FILTROS DE FACTURAS -->
    <div class="section">
      <h3>Historial y Búsqueda de Facturas</h3>

      <!-- Formulario de Filtros -->
      <div class="filtros-grid">
        <div>
          <label>N° Factura:</label>
          <input type="number" id="filtroNumero" placeholder="Ej: 1001" />
        </div>
        <div>
          <label>Cliente:</label>
          <input
            type="text"
            id="filtroCliente"
            placeholder="Buscar por nombre..."
          />
        </div>
        <div>
          <label>Fecha Desde:</label>
          <input type="date" id="filtroFechaDesde" />
        </div>
        <div>
          <label>Fecha Hasta:</label>
          <input type="date" id="filtroFechaHasta" />
        </div>
        <div>
          <label>Estado:</label>
          <select id="filtroEstado">
            <option value="">Todos</option>
            <option value="EMITIDA">Emitida</option>
            <option value="ANULADA">Anulada</option>
          </select>
        </div>
        <div>
          <label>Informada ARCA:</label>
          <select id="filtroArca">
            <option value="">Todas</option>
            <option value="true">Sí (con CAE)</option>
            <option value="false">No (sin CAE)</option>
          </select>
        </div>
      </div>

      <div style="display: flex; gap: 10px; margin-top: 15px">
        <button id="btnFiltrar" class="btn-primary">Filtrar</button>
        <button id="btnLimpiarFiltros" class="btn-outline">Limpiar</button>
      </div>

      <!-- Tabla de Facturas -->
      <table id="tablaGrillaFacturas">
        <thead>
          <tr>
            <th>ID</th>
            <th>N° Factura</th>
            <th>Fecha</th>
            <th>Cliente</th>
            <th>Total</th>
            <th>Estado</th>
            <th>ARCA</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td colspan="8" style="text-align: center">Cargando facturas...</td>
          </tr>
        </tbody>
      </table>

      <!-- Controles de Paginación -->
      <div class="paginacion-bar">
        <button id="btnPaginaAnterior" class="btn-outline">« Anterior</button>
        <span id="infoPaginacion">Página 1 de 1</span>
        <button id="btnPaginaSiguiente" class="btn-outline">Siguiente »</button>
      </div>
    </div>

    <!-- 2. FORMULARIO DE ALTA / EDICIÓN -->
    <div id="alertaEstado" style="display: none"></div>

    <div class="section" id="seccionFormulario">
      <h3 id="tituloFormulario">Nueva Factura de Venta</h3>
      <div class="form-group">
        <label
          >Número Factura (Dejar vacío para crear como Borrador sin
          número):</label
        >
        <input
          type="number"
          id="numeroFacturaInput"
          placeholder="Ej: 1005 (o vacío para Borrador)"
        />
      </div>
      <div class="form-group">
        <label>Cliente:</label>
        <select id="clienteSelect">
          <option value="">Cargando...</option>
        </select>
      </div>
      <div class="form-group">
        <label>Punto de Venta:</label>
        <select id="puntoVentaSelect">
          <option value="">Cargando...</option>
        </select>
      </div>
      <div class="form-group">
        <label>Moneda:</label>
        <select id="monedaSelect">
          <option value="">Cargando...</option>
        </select>
      </div>
    </div>

    <div class="section" id="seccionDetalles">
      <h3>Detalle de Artículos</h3>
      <div style="display: flex; gap: 10px; align-items: flex-end">
        <div style="flex: 1">
          <label>Artículo:</label>
          <select id="articuloSelect">
            <option value="">Cargando...</option>
          </select>
        </div>
        <div style="width: 120px">
          <label>Cantidad:</label>
          <input type="number" id="cantidadInput" min="1" value="1" />
        </div>
        <button id="btnAgregarLinea" class="btn-outline">+ Agregar</button>
      </div>

      <table id="tablaDetalles">
        <thead>
          <tr>
            <th>ID Artículo</th>
            <th>Cantidad</th>
            <th>Acción</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- Acciones del Formulario -->
    <div class="actions-bar">
      <button id="btnGuardarFactura" class="btn-primary">Crear Factura</button>
      <button
        id="btnActualizarFactura"
        class="btn-primary"
        style="display: none"
      >
        Guardar Cambios
      </button>
      <button id="btnAnularFactura" class="btn-warning" style="display: none">
        Anular Factura
      </button>
      <button id="btnEliminarFactura" class="btn-danger" style="display: none">
        Eliminar Factura
      </button>
      <button id="btnImprimirPdf" class="btn-outline" style="display: none">
        📄 Imprimir Factura (PDF)
      </button>
      <button id="btnNuevaFactura" class="btn-outline" style="display: none">
        + Limpiar y Crear Nueva
      </button>
    </div>

    <script type="module" src="./src/app.js"></script>
  </body>
</html>
