<div class="section" id="seccionFormulario">
  <div
    style="
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    "
  >
    <h3 id="tituloFormulario" style="margin: 0">Nueva Factura de Venta</h3>
    <button type="button" id="btnCerrarFormulario" class="btn-outline">
      ✕ Cerrar
    </button>
  </div>

  <!-- Cartel informativo cuando la factura NO se puede editar -->
  <div
    id="bannerSoloLectura"
    style="
      display: none;
      background-color: #fef3c7;
      border-left: 4px solid #f59e0b;
      color: #92400e;
      padding: 10px 14px;
      margin-bottom: 15px;
      border-radius: 4px;
      font-size: 0.95em;
    "
  >
    🔒 <strong>Modo Solo Lectura:</strong> Este comprobante ya fue informado a
    ARCA (posee CAE) o se encuentra anulado, por lo que no permite
    modificaciones.
  </div>

  <div class="filtros-grid">
    <!-- Número de Factura -->
    <div class="form-group">
      <label>Número de Factura:</label>
      <input
        type="text"
        id="numeroFacturaInput"
        readonly
        placeholder="Se asigna al informar a ARCA"
        style="background-color: #e5e7eb; font-weight: bold"
      />
    </div>

    <!-- Fecha editable -->
    <div class="form-group">
      <label>Fecha de Emisión:</label>
      <input type="date" id="fechaEmisionInput" />
    </div>

    <!-- Tipo de Factura -->
    <div class="form-group">
      <label>Tipo de Factura:</label>
      <select id="tipoComprobanteSelect">
        <option value="B" selected>Factura B (Consumidor Final)</option>
        <option value="A">Factura A (Resp. Inscripto)</option>
        <option value="C">Factura C (Monotributo / Oficial)</option>
        <option value="X">Factura X (Presupuesto / No Fiscal)</option>
      </select>
    </div>

    <!-- Lista de Precios -->
    <div class="form-group">
      <label>Lista de Precios:</label>
      <select id="listaPrecioSelect">
        <option value="1">Lista Mayorista</option>
        <option value="2" selected>Lista Minorista</option>
      </select>
    </div>

    <div class="form-group">
      <label>Punto de Venta:</label>
      <select id="puntoVentaSelect">
        <option value="">Cargando...</option>
      </select>
    </div>

    <div class="form-group">
      <label>Moneda:</label>
      <select id="monedaSelect">
        <option value="">Cargando...</option>
      </select>
    </div>
  </div>

  <!-- Cliente: Explorer + Opción de borrar con botón o teclado -->
  <div class="form-group" style="margin-top: 10px">
    <label
      >Cliente (Consumidor Final por defecto o elija mediante Explorer):</label
    >
    <div style="display: flex; gap: 8px">
      <input type="hidden" id="clienteIdHidden" />
      <input
        type="text"
        id="clienteNombreInput"
        placeholder="Consumidor Final (o busque con el Explorer)..."
        style="flex: 1; background-color: #f9fafb"
        title="Puede borrar el texto para volver a Consumidor Final"
      />
      <button
        type="button"
        id="btnLimpiarCliente"
        class="btn-outline"
        title="Quitar cliente seleccionado"
      >
        ✕ Limpiar
      </button>
      <button type="button" id="btnAbrirModalCliente" class="btn-outline">
        🔍 Explorer Clientes
      </button>
    </div>
  </div>
</div>

<!-- DETALLE DE ARTÍCULOS -->
<div class="section" id="seccionDetalles">
  <h3>Detalle de Artículos</h3>

  <!-- Barra para agregar productos con Descuento -->
  <div
    id="barraAgregarArticulo"
    style="
      display: flex;
      gap: 10px;
      align-items: flex-end;
      flex-wrap: wrap;
      margin-bottom: 15px;
    "
  >
    <div style="flex: 2; min-width: 250px">
      <label>Artículo:</label>
      <div style="display: flex; gap: 8px">
        <input type="hidden" id="articuloIdHidden" />
        <input
          type="text"
          id="articuloNombreInput"
          readonly
          placeholder="Busque un artículo con el Explorer..."
          style="flex: 1; background-color: #f9fafb"
        />
        <button type="button" id="btnAbrirModalArticulo" class="btn-outline">
          🔍 Explorer Artículos
        </button>
      </div>
    </div>

    <div style="width: 100px">
      <label>Cantidad:</label>
      <input type="number" id="cantidadInput" min="1" value="1" />
    </div>

    <div style="width: 100px">
      <label>% Descuento:</label>
      <input type="number" id="descuentoInput" min="0" max="100" value="0" />
    </div>

    <button type="button" id="btnAgregarLinea" class="btn-outline">
      + Agregar Renglón
    </button>
  </div>

  <!-- Tabla de Artículos Cargados -->
  <table id="tablaDetalles">
    <thead>
      <tr>
        <th>Producto</th>
        <th>Precio Unit.</th>
        <th>Cantidad</th>
        <th>% Desc.</th>
        <th>Subtotal</th>
        <th>Acción</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <div
    style="
      text-align: right;
      margin-top: 12px;
      font-size: 1.15em;
      font-weight: bold;
    "
  >
    Total Estimado: $<span id="totalFacturaEstimado">0.00</span>
  </div>
</div>
