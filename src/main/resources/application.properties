spring.application.name=trabajo-practico-spring
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tp_spring}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# Configuraci\u00f3n ARCA / AFIP Homologaci\u00f3n
# Tu CUIT (sin guiones)
afip.cuit=20421683817

# Nombres de tus archivos en la carpeta certs
afip.cert-path=certs/certificado_mi_cuit.crt
afip.key-path=certs/privada_mi_cuit.key

# Punto de venta de pruebas
afip.punto-venta=2

# 11 = Factura C (Monotributo) / 6 = Factura B (Responsable Inscripto)
afip.cbte-tipo=11