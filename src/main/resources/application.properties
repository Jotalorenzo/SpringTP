spring.application.name=trabajo-practico-spring

# Conexi\u00f3n a Base de Datos (usa 'postgres' por defecto para Docker, o variables de entorno locales)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/tp_spring}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=admin123
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

# Configuraci\u00f3n ARCA / AFIP Homologaci\u00f3n (Listas para usar por cualquier compa\u00f1ero)
afip.cuit=${AFIP_CUIT:20421683817}
afip.cert-path=${AFIP_CERT_PATH:certs/certificado_mi_cuit.crt}
afip.key-path=${AFIP_KEY_PATH:certs/privada_mi_cuit.key}
afip.punto-venta=${AFIP_PTO_VENTA:2}
afip.cbte-tipo=${AFIP_CBTE_TIPO:11}